<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>任务管理器</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <main class="container">
    <header class="app-header">
      <h1>✅ 任务管理器</h1>
      <p class="subtitle">一个简单的全栈示例 · Flask + SQLite + 原生 JavaScript</p>
      <button type="button" id="chat-open" class="btn btn-secondary">AI 聊天</button>
    </header>

    <section class="card add-card">
      <form id="task-form" autocomplete="off">
        <input
          type="text"
          id="title-input"
          class="input"
          placeholder="需要做什么？"
          maxlength="200"
          required
        />
        <textarea
          id="desc-input"
          class="input textarea"
          placeholder="描述（可选）"
          rows="2"
        ></textarea>
        <button type="submit" class="btn btn-primary">添加任务</button>
      </form>
    </section>

    <section class="card recommend-card" aria-labelledby="breakdown-heading">
      <h2 id="breakdown-heading">AI 分解任务</h2>
      <form id="breakdown-form">
        <label for="breakdown-goal">你想完成什么？</label>
        <textarea id="breakdown-goal" class="input textarea" maxlength="2000" rows="3" required
          placeholder="例如：两周内完成实习汇报，准备演示文稿并至少彩排一次"></textarea>
        <p class="recommend-note">仅将此处输入发送给配置的模型服务。生成后可修改或移除草稿，确认后才加入列表。</p>
        <button type="submit" id="breakdown-generate" class="btn btn-primary">生成子任务</button>
      </form>
      <p id="breakdown-status" class="recommend-status" role="status"></p>
      <form id="breakdown-save-form" hidden>
        <ol id="breakdown-results" class="recommend-results" aria-label="子任务草稿"></ol>
        <button type="submit" id="breakdown-save" class="btn btn-primary">批量加入任务列表</button>
      </form>
    </section>

    <section class="card recommend-card" aria-labelledby="recommend-heading">
      <h2 id="recommend-heading">今天先做什么？</h2>
      <form id="recommend-form">
        <label for="recommend-context">今天的安排（选填）</label>
        <input type="text" id="recommend-context" class="input" maxlength="300"
          placeholder="例如：我现在只有 30 分钟" />
        <p class="recommend-note">生成时会将未完成任务的标题、描述和你填写的安排发送给配置的模型服务。</p>
        <button type="submit" id="recommend-submit" class="btn btn-primary">生成建议</button>
      </form>
      <p id="recommend-status" class="recommend-status" role="status"></p>
      <ol id="recommend-results" class="recommend-results" aria-label="任务推荐顺序"></ol>
    </section>

    <nav class="filters">
      <button class="filter-btn is-active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="active">进行中</button>
      <button class="filter-btn" data-filter="completed">已完成</button>
      <span id="task-count" class="task-count"></span>
    </nav>

    <section>
      <ul id="task-list" class="task-list"></ul>
      <p id="empty-state" class="empty-state">还没有任务，先在上方添加一个吧 🎉</p>
    </section>
  </main>

  <div id="edit-modal" class="modal-overlay is-hidden">
    <div class="modal">
      <h2>编辑任务</h2>
      <input type="text" id="edit-title" class="input" maxlength="200" />
      <textarea id="edit-desc" class="input textarea" rows="3"></textarea>
      <div class="modal-actions">
        <button id="edit-cancel" class="btn btn-secondary">取消</button>
        <button id="edit-save" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <dialog id="chat-dialog" class="chat-dialog" aria-labelledby="chat-heading">
    <header class="chat-header">
      <h2 id="chat-heading">AI 聊天</h2>
      <button type="button" id="chat-close" class="btn btn-secondary">关闭</button>
    </header>
    <p id="chat-note" class="recommend-note"></p>
    <p id="chat-empty" class="recommend-note"></p>
    <ol id="chat-log" class="chat-log" role="log" aria-label="对话记录" tabindex="0"></ol>
    <form id="chat-form">
      <label for="chat-input">你的消息</label>
      <textarea id="chat-input" class="input textarea" rows="3" maxlength="2000" required></textarea>
      <p id="chat-status" class="recommend-status" role="status"></p>
      <div class="chat-actions">
        <button type="submit" id="chat-send" class="btn btn-primary">发送</button>
        <button type="button" id="chat-reset" class="btn btn-secondary">清空对话</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
